id: get-going-keep-doing
title: 'Get going, keep doing: rebuilding activity'
category: technique
summary: 'Low mood and withdrawal feed each other: doing less lowers mood, and low mood leads to doing
  even less. Breaking the cycle means starting very small tasks before the motivation arrives. Success
  with a tiny step lifts mood and confidence.'
when_to_use:
- The person has stopped doing things they used to do
- Low energy or low mood is keeping the person in bed or on the sofa
when_not_to_use:
- Do not set ambitious goals; plans that are too big usually end in feeling like a failure
- Do not suggest waiting until motivation returns
steps:
- Notice the cycle of low mood and doing less
- Pick one very small task, such as sorting laundry or a short walk
- Break it into tiny steps
- Choose a day and time when your energy is usually best
- Set a reminder or ask someone to check in
- Notice the small success and build up gradually
emotions:
- sadness
- neutral
role_affinity:
- mentor
- peer
