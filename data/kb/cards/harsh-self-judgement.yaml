id: harsh-self-judgement
title: Unhooking from harsh self-judgement
category: technique
summary: Unkind thoughts about yourself, such as being weak or a bad parent, are common under stress.
  Getting hooked by them pulls you away from your values. You can notice and name the thought, add the
  words 'I notice', then ground yourself and turn back to what is around you.
when_to_use:
- The person criticises themselves harshly or says they are not good enough
- Guilt or shame is dominating the conversation
when_not_to_use:
- Do not argue with the thought or insist it is false; noticing and naming is enough
- Not a substitute for extra support if feelings of worthlessness last a long time
steps:
- Choose the unkind thought that keeps showing up
- Silently say that this is a harsh self-judgement or an unkind thought
- Put the words 'I notice' in front of it
- Ground yourself by noticing what you can see, hear, touch, taste and smell
- Return to what you were doing
