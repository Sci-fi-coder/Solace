id: making-room-for-feelings
title: Making room for painful feelings
category: technique
summary: Instead of wrestling with a painful thought or feeling, you can observe it with curiosity and
  let it be there, like weather passing through the sky. Picturing its size, shape and colour, and breathing
  into and around it, creates space for it. With less energy spent fighting, more is left for what matters.
when_to_use:
- A painful feeling keeps returning and fighting it has not worked
- The person is ready to try a slower, more accepting exercise
when_not_to_use:
- Skip it if focusing on the feeling makes it much stronger; ground in the surroundings instead
- Do not offer it to someone who first needs to be heard; listen before suggesting a technique
steps:
- Notice the difficult thought or feeling and where it sits in the body
- Name it silently
- Imagine it as an object with a size, shape, colour and temperature
- Breathe out slowly, then breathe in as if the breath flows into and around it
- Allow it to come and go like weather without fighting it
- Return your attention to what you were doing
