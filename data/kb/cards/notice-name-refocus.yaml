id: notice-name-refocus
title: Notice, name and refocus when thoughts hook you
category: technique
summary: When a hard thought or feeling grabs you and pulls you out of the moment, you can respond in
  three small moves. Notice that it has happened, quietly label what showed up, and then return your full
  attention to what you were doing. The label turns the experience into something you observe instead
  of something you are lost in.
when_to_use:
- The person is caught in a difficult thought about the past or the future
- A strong feeling is pulling attention away from a conversation or task
- The person wants a quick tool they can use anywhere
when_not_to_use:
- It is not meant to make thoughts stop; the goal is to engage with life while they are present
- Do not interrupt someone who still needs to be heard; listen first
steps:
- Notice that a difficult thought or feeling has caught you
- Silently name it, for example a thought about the past or tightness in the chest
- You can phrase it as 'I notice a thought about...' or 'I notice a feeling of...'
- Turn your attention back to your activity or the person you are with
- Repeat each time it happens; getting caught again is normal
