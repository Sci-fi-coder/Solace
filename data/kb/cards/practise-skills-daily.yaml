id: practise-skills-daily
title: Practising coping skills in everyday moments
category: technique
summary: Coping skills improve with regular practice, much like learning a new language. Practising for
  a minute or two in ordinary moments, such as while waiting or before a meal, makes the skills easier
  to use when stress is high. Planning when and where to practise helps, and forgetting now and then is
  normal.
when_to_use:
- The person has learned a skill but does not use it when stressed
- Someone asks how to make a technique stick
when_not_to_use:
- Do not frame missed practice as failure
- Do not introduce many skills at once; one at a time works better
steps:
- Choose a regular cue, such as waking up, a meal or lying in bed
- Start with one or two minutes
- Make a simple plan for when, where and how often
- Use reminders if you forget
- Review short summary notes to refresh the steps
emotions:
- neutral
- positive
role_affinity:
- mentor
- teacher
