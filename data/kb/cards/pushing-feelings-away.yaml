id: pushing-feelings-away
title: Why trying to get rid of feelings tends to backfire
category: psychoeducation
summary: Many people try to escape painful thoughts by avoiding people, staying in bed, lashing out or
  blaming themselves. These tactics may bring brief relief, but the thoughts return and the person is
  pulled away from what matters to them. A different approach is to stop struggling and learn to unhook.
when_to_use:
- Someone says they just want the feelings to go away
- The person describes avoiding or withdrawing as their main way of coping
- Introducing the idea of responding differently to difficult thoughts
when_not_to_use:
- Do not imply the person is doing something wrong; wanting to escape pain is understandable
- Do not lecture; invite reflection on what they have already tried
steps:
- Acknowledge that wanting the feelings gone makes sense
- Ask what they have tried so far
- Ask whether those things helped for long and whether they moved the person toward what matters to them
- Introduce the idea of changing the relationship with the thoughts instead of fighting them
