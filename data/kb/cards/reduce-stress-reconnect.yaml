id: reduce-stress-reconnect
title: Reducing stressors and rebuilding social connections
category: technique
summary: When someone is struggling, look for pressures that can be eased, such as relationship, work,
  money or study problems, and bring back contact with family, friends and community activities they once
  enjoyed. Simple stress management, such as relaxation or problem solving, adds to this. Practical stress
  relief and social reconnection often work best together.
when_to_use:
- The person is under several pressures at once
- Social contact has dropped since things got hard
when_not_to_use:
- Do not push the person back into a harmful or unsafe relationship
- Do not overlook abuse; those situations call for protection and professional help
steps:
- Ask what pressures are weighing on the person right now
- Pick one that could be eased
- Recall past social activities that felt supportive
- Choose one to restart in a small way
- Add a simple stress skill such as relaxation or problem solving
