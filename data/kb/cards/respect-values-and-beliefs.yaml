id: respect-values-and-beliefs
title: Respecting a person's values, beliefs and background
category: communication_skill
summary: Support works better when you respect the person's culture, faith and personal values and put
  your own judgements aside. If something is unclear, you can ask about their beliefs and customs, which
  shows respect and avoids missing important information. Language and comfort preferences matter too.
when_to_use:
- The person mentions religion, family expectations or cultural customs
- Your suggestion might clash with their beliefs
when_not_to_use:
- Do not assume beliefs from a group label
- Do not argue against beliefs unless they clearly put someone at risk, and then only with great sensitivity
steps:
- Notice and set aside your own judgements
- Ask about beliefs, customs or language that matter to the person
- Use their words and framing where possible
- Check how comfortable they are with the conversation
- Stay respectful even when you see things differently
emotions:
- others
- neutral
role_affinity:
- counsellor
- teacher
