id: settling-when-sleepless
title: Settling yourself when you cannot sleep
category: technique
summary: When you are lying awake you can practise slowing down and connecting with your body, or combine
  slow breathing with making room for painful thoughts. It may not bring sleep, but it can help you feel
  rested. A hand placed over a painful feeling, with kind intention, can be added.
when_to_use:
- The person lies awake worrying or ruminating at night
- Sleep trouble is tied to stress or low mood
when_not_to_use:
- Do not promise that the exercise will make someone sleep
- If sleep trouble is long-lasting or affecting daily life, suggest speaking to a health professional
steps:
- Notice how you feel and what you are thinking
- Slow your breathing, breathing out gently and fully
- Press your feet against the bed or stretch slowly
- Make room for any painful thought or feeling and let it pass
- Optionally rest a hand where you feel the pain
