id: slow-breathing-grounding
title: Longer slow-breathing grounding exercise
category: technique
summary: A longer form of grounding built around very slow, gentle breathing. Attention drifts away again
  and again, and each time you notice, you simply return to the breath. The aim is to train steady focus,
  not to breathe perfectly.
when_to_use:
- The person wants a calming practice they can repeat daily for a few minutes
- Restlessness or anxiety is present and the person wants something to do with their body
when_not_to_use:
- Skip deep or forceful breaths; they can bring on dizziness or panic
- If dizziness or a tight chest appears, switch to shallow, slow in-breaths and gentle out-breaths
steps:
- Notice how you feel and what you are thinking
- Breathe out slowly and gently until your lungs feel empty, then let them refill at their own slow pace
- Pause briefly after breathing out before the next breath
- Follow the air moving in and out and the movement of your chest and belly
- When thoughts pull you away, notice that and come back to the breath, as many times as needed
- Finish by looking around and noticing what you can see, hear and touch
emotions:
- anxiety_fear
- anger
