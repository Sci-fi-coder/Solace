id: small-acts-of-kindness
title: Small acts of kindness toward others
category: technique
summary: Even tiny kind actions, including a few caring words, can make a difference to someone who is
  hurting and let you act on your values. Being kind to yourself can leave you with more energy to help
  others.
when_to_use:
- The person wants to feel useful or connected
- A friend or family member is struggling and the person wants to help
when_not_to_use:
- Do not use it to pressure someone to look after others when they are depleted
- Avoid suggesting it during acute distress; steady the person first
steps:
- Notice someone nearby who is struggling
- Think of one small kind action, such as a caring word or message
- Do it, however small
- Notice how it feels to give support
- Keep some kindness for yourself as well
emotions:
- positive
- others
role_affinity:
- peer
- mentor
sources:
