id: small-steps-after-isolation
title: Small steps after long social isolation
category: technique
summary: After a long time alone, sharing personal things can feel nerve-racking. Starting with tiny gestures,
  such as smiling at familiar faces, saying hello to a neighbour or inviting a relative for a meal, builds
  confidence for deeper connection later.
when_to_use:
- The person has withdrawn from people for a long time
- Talk of reaching out makes the person nervous
when_not_to_use:
- Do not press for disclosure or big social plans
- Do not frame isolation as a personal failing
steps:
- Acknowledge that reaching out can feel nerve-racking
- Pick the smallest possible gesture, such as a smile or a greeting
- Try it with someone familiar and safe
- Slowly add a short chat or a shared meal
- Share more only when you feel ready
emotions:
