id: speaking-kindly-to-yourself
title: Speaking kindly to yourself when it hurts
category: technique
summary: Think of how it feels when someone reaches out with care while you are struggling, and offer
  yourself the same. Short honest phrases that acknowledge the pain, such as noting that this is hard,
  can help. A hand resting where it hurts, with the intention of kindness, is another way to do this.
when_to_use:
- The person is in emotional pain and is being hard on themselves
- The person is hurting and could use a gentle way to respond to their own pain
when_not_to_use:
- Do not push self-kindness as a demand; it can feel strange at first
- Avoid scripted praise that sounds untrue; keep the wording honest
steps:
- Notice that you are in pain
- Say something kind and honest to yourself, such as that this is hard
- Remind yourself you can still be caring toward yourself and others
- If it helps, rest a hand on the part of the body that feels the pain
- Imagine kindness flowing through your hand into that area
emotions:
- shame_guilt
- sadness
role_affinity:
