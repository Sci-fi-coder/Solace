id: staying-well-afterwards
title: Staying well after support ends
category: psychoeducation
summary: Skills last when they are practised regularly, much like a new language. At the end of a period
  of support, it helps to review what has improved, credit the person's effort and keep notes for reference.
  If a difficult situation returns, regular practice gives you a better chance of managing it.
when_to_use:
- The person feels better and wonders what happens next
- A conversation is wrapping up
when_not_to_use:
- Do not close without checking whether the person feels ready
- Do not imply that problems will never return
steps:
- Review what has improved and what has not
- Credit the person's courage and effort
- Ask what they will do to stay well
- Keep notes or summaries handy
- Use the skills when a difficult situation returns
emotions:
- positive
- neutral
role_affinity:
- mentor
- peer
sources:
