id: three-hard-situation-options
title: Three approaches to a difficult situation
category: psychoeducation
summary: 'When facing a difficult situation there are three broad options: leave, change what can be changed
  while accepting the pain that cannot be changed, or give up and drift from your values. Sometimes leaving
  is not possible, which may leave a choice between the second and third. Acting where you can, and steadying
  yourself around the unavoidable pain, keeps you moving toward what matters.'
when_to_use:
- The person feels trapped by a situation they cannot simply walk away from
- Anger or hopelessness about things outside their control
- The person needs help separating what can change from what cannot
when_not_to_use:
- Do not present acceptance as a reason to stay in harm; safety comes first
- Do not use this to dismiss problems that really can be changed
steps:
- Ask whether leaving is possible and safe
- If not, list what can be changed, even a little
- Take one small action on something within your control
- For the pain that cannot be changed, ground and unhook instead of fighting it
- Check whether the action moves you toward your values
