id: tiny-value-actions
title: Tiny actions that fit your values
category: technique
summary: Even in stressful times, small deliberate actions can express what matters to you. Choose one
  realistic thing to do or say in the coming week, and shrink it if it feels too hard. Starting each day
  by recalling a couple of values gives you something to aim at.
when_to_use:
- The person knows what matters to them but feels unable to act
- A relationship needs care and the person does not know where to begin
- The person is ready for a concrete next step
when_not_to_use:
- Do not set large goals for someone who feels overwhelmed; keep the step very small
- Do not treat a missed action as failure; adjust the plan instead
steps:
- Pick an important relationship or area of life
- Name the value you want to live by there
- Decide one concrete thing to say or do this week
- If you doubt you can do it, choose something smaller
- Begin the day by recalling two or three values and watch for chances to act on them
emotions:
- sadness
- neutral
- positive
role_affinity:
- mentor
- peer
