id: validating-feelings
title: Validating someone's feelings and praising openness
category: communication_skill
summary: Many people worry that their feelings mean they are weak or something is wrong with them. Letting
  them know their reactions are understandable and common helps. Thank them for opening up, and avoid
  claiming you know exactly what they are going through.
when_to_use:
- The person is embarrassed to talk about their feelings
- The person blames themselves for how they feel
- A difficult disclosure has just been made
when_not_to_use:
- Do not minimise or hurry to fix
- Do not compare at length with your own experience or say you know exactly how it feels
steps:
- Listen first
- Say their reaction makes sense given what happened
- Mention that many people react in similar ways
- Thank them for sharing something hard
- Avoid saying you know exactly how it feels
emotions:
