id: when-to-seek-support
title: When to seek professional support
category: when_to_seek_help
summary: It may be time to talk to a professional when stress or anxiety will not go away, when coping
  is getting harder, or when feelings interfere with everyday life or lead to avoiding things. Reaching
  out to a doctor, counsellor or campus support service is a way of taking care of yourself. If someone
  is in immediate danger, the priority is getting safe, in-person help right away.
when_to_use:
- Stress or low mood has lasted a long time or is getting worse
- The person says they cannot cope or is avoiding daily activities
when_not_to_use:
- Do not use it to dismiss the person; keep listening
- Do not quote contact numbers from this card; use verified resources only
steps:
- Ask how long this has been going on and how much it affects daily life
- Acknowledge that asking for help takes courage
- Suggest a doctor, counsellor or campus support service
- Offer to help think through what to say
- Encourage keeping track of symptoms and seeking help sooner if they worsen
