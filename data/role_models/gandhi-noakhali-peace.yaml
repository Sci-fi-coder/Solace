summary: "During communal violence and displacement in 1946–47, Gandhi travelled through affected areas, including Noakhali, urging restraint, mutual protection, and reconciliation. Nanda presents this as a mission of peace amid intense conflict."
lesson: "When relationships or communities are strained, small acts that reduce harm and protect people can matter even when a complete solution is not immediately possible."
framing: "An analogy about patient, nonviolent efforts to reduce conflict."
avoid_when: "Avoid in situations of active violence or coercion; prioritise safety and specialist support rather than reconciliation."
