summary: "After violence at Chauri Chaura in 1922, Gandhi called off the non-cooperation campaign, despite opposition from colleagues who feared the decision would waste the movement's momentum."
lesson: "Changing course after new evidence is not always giving up; sometimes responsibility means pausing a plan that is producing harm."
