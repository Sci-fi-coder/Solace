summary: "After the violence at Chauri Chaura in 1922, Gandhi cancelled the planned civil-disobedience action at Bardoli and suspended the aggressive part of the non-cooperation campaign, turning instead toward constructive work."
lesson: "Changing course after new evidence is not always giving up; sometimes responsibility means pausing or changing a plan when its consequences become harmful."
framing: "A historical analogy about reassessing a course of action when consequences change."
