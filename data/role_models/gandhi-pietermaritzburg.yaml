summary: "In 1893, Gandhi was removed from a first-class railway compartment at Pietermaritzburg despite holding a first-class ticket. Nanda describes the incident as a turning point that pushed him toward organised opposition to racial discrimination in South Africa."
lesson: "After an unjust experience, it can help to pause, name what happened, and decide what constructive response aligns with your values."
framing: "An analogy about turning anger after injustice into purposeful action, not a comparison of the user's circumstances."
