summary: "At Tolstoy Farm, Gandhi expected residents, including children, to take part in practical manual work. Nanda describes shared labour as part of the community's daily life."
lesson: "A shared task or modest routine can reduce isolation and make a large challenge feel more manageable."
framing: "An analogy about cooperation and practical participation, not a claim that routine solves every problem."
avoid_when: "Avoid if the user is exhausted, unwell, or already carrying an unfair share of responsibilities."
