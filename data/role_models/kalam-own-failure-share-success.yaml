summary: "Kalam recounts the 1979 SLV-3 launch failure and the successful 1980 launch. ISRO Chairman Satish Dhawan took responsibility publicly after the failure and shared the success with the team after the later launch."
lesson: "In a team setback, distinguish learning from blame; leaders can take responsibility for failure and recognise the people who contribute to success."
framing: "Kalam's account of leadership by Satish Dhawan; these actions must not be attributed to Kalam."
avoid_when: "Avoid if the user is being scapegoated or is not actually responsible for the outcome."
