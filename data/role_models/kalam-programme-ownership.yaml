summary: "Kalam describes how a large group of scientists and technical staff became involved in the missile programme and came to feel ownership because they had participated in shaping it. He presents shared ownership as a foundation for coordinated work."
lesson: "When a project feels like one person's burden, clarify roles and invite the team to take meaningful ownership of specific parts."
framing: "A leadership lesson from Kalam's account of programme management."
avoid_when: "Do not use to excuse poor management or transfer unreasonable workload to team members."
