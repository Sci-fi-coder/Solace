summary: "Marcus compares human beings to parts of a larger whole and argues that people are made for cooperation, like feet, hands, and eyelids. He cautions against acting against one another when shared life requires mutual contribution."
lesson: "When conflict arises, consider whether a response can protect your boundary while still leaving room for cooperation where it is safe."
framing: "A Stoic reflection on social nature and mutual responsibility."
avoid_when: "Avoid encouraging reconciliation with someone who is abusive, coercive, or unsafe."
