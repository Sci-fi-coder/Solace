summary: "Marcus argues that distress about an external event is shaped by the judgement a person makes about it, and that this judgement can be examined. The passage encourages checking the interpretation before treating it as the only possible view."
lesson: "Ask: what happened, what am I telling myself it means, and what other interpretation is also plausible?"
framing: "A Stoic reflection that can support perspective-taking, not a claim that painful events are harmless."
avoid_when: "Avoid implying that a person is responsible for distress caused by abuse, discrimination, trauma, or material hardship."
