summary: "Marcus writes to himself about the difficulty of leaving bed and reminds himself that he is getting up to do the work proper to a human being. The passage frames action as a response to purpose rather than mood."
lesson: "When starting feels difficult, choose one small, worthwhile action before judging the whole day."
framing: "A Stoic reflection on action and duty; not a judgement that tiredness is laziness."
avoid_when: "Avoid during severe exhaustion, illness, burnout, or persistent low energy; do not moralise symptoms."
