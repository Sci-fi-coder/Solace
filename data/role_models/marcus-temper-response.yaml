summary: "Marcus advises that the best way of avenging a wrong is not to become like the person who committed it. He also recommends considering the mistaken judgement behind another person's action rather than reacting with uncontrolled anger."
lesson: "Before replying in anger, pause and decide what outcome you want your response to achieve."
framing: "A philosophical analogy about restraint and deliberate response."
avoid_when: "Do not frame tolerating mistreatment as virtue; safety and boundaries come first."
