summary: "Vivekananda travelled to the 1893 Parliament of Religions in Chicago with limited resources and faced practical uncertainty about participation. The biography recounts how he eventually addressed the gathering and attracted an enthusiastic response."
lesson: "You do not need to feel completely ready before taking a carefully considered first step; preparation and seeking help can make the step possible."
framing: "An analogy about acting despite uncertainty, not pressure to take risks without support."
