summary: "The biography recounts Vivekananda urging his fellow monks to attend to the suffering of poor workers and to translate spiritual ideals into practical service. He challenged them to consider whether their learning and discipline helped people in need."
lesson: "When it feels appropriate, one small act of useful connection can give structure and meaning to a difficult day; it should be chosen freely, not as an obligation."
framing: "A historical example of linking purpose with service."
avoid_when: "Do not burden a distressed user with responsibility for fixing other people's problems."
