summary: "Near the end of his life, Vivekananda reflected that a leader who remains constantly present can prevent trained disciples from developing independently. The biography describes his view that people need room to grow after training."
lesson: "Supporting someone does not always mean doing everything for them; clear guidance followed by room to practise can build independence."
framing: "An analogy about mentoring and autonomy."
